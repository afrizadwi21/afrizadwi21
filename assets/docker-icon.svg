<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="60" height="60">
  <defs>
    <style>
      @keyframes wave { 0% { x: 0px; } 100% { x: -100px; } }
      @keyframes fill { 0%, 15% { y: 74px; } 65%, 100% { y: 20px; } }
      @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-3.5px); } }
      @keyframes pulse { 0%, 100% { stroke-opacity: 0.4; } 50% { stroke-opacity: 1; } }
      .box { fill: #0d1117; stroke: #0db7ed; stroke-width: 2.5; animation: pulse 2.5s infinite ease-in-out; }
      .wave-rect { animation: wave 3.8s infinite linear, fill 4.2s infinite ease-in-out alternate; }
      .lbl { font-family: Arial, Helvetica, sans-serif; font-size: 21px; font-weight: 900; fill: #ffffff; animation: float 2.2s infinite ease-in-out; }
      .sub { font-family: monospace; font-size: 8px; font-weight: bold; fill: #0db7ed; }
    </style>
    <pattern id="w-docker-icon" width="0.1" height="1">
      <path fill="#0db7ed" fill-opacity="0.82" d="M 0 10 C 3 12, 5 15, 14 10 C 17 9, 20 5, 30 10 L 30 80 L 0 80 z"/>
    </pattern>
    <mask id="m-docker-icon">
      <rect x="18" y="18" width="64" height="64" rx="14" fill="white"/>
    </mask>
  </defs>
  <rect class="box" x="18" y="18" width="64" height="64" rx="14"/>
  <rect class="wave-rect" mask="url(#m-docker-icon)" fill="url(#w-docker-icon)" x="0" y="70" width="300" height="100"/>
  <text class="lbl" x="50" y="56" text-anchor="middle">DKR</text>
  <text class="sub" x="50" y="74" text-anchor="middle">DOCKER</text>
</svg>
