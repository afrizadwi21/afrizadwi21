<svg width="205" height="74" viewBox="0 0 205 74" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes glowPulse { 0%, 100% { stroke-opacity: 0.45; } 50% { stroke-opacity: 1; } }
      @keyframes badgeFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-2.5px); } }
      .card-bg { fill: #090e1a; stroke: #ec4899; stroke-width: 1.5; rx: 12px; animation: glowPulse 3s infinite ease-in-out; }
      .icon-wrap { animation: badgeFloat 2.4s infinite ease-in-out; }
      .plat { font-family: monospace; font-size: 10px; font-weight: bold; fill: #ec4899; letter-spacing: 1px; }
      .hand { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
      .sub { font-family: monospace; font-size: 9.5px; fill: #94a3b8; }
    </style>
    <linearGradient id="igGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f09433"/>
      <stop offset="25%" stop-color="#e6683c"/>
      <stop offset="50%" stop-color="#dc2743"/>
      <stop offset="75%" stop-color="#cc2366"/>
      <stop offset="100%" stop-color="#bc1888"/>
    </linearGradient>
  </defs>
  <rect class="card-bg" x="2" y="2" width="201" height="70" rx="12"/>
  <g class="icon-wrap">
    
  <rect x="14" y="15" width="44" height="44" rx="11" fill="url(#igGrad)"/>
  <rect x="22" y="23" width="28" height="28" rx="7" fill="none" stroke="#ffffff" stroke-width="2.4"/>
  <circle cx="36" cy="37" r="6.5" fill="none" stroke="#ffffff" stroke-width="2.4"/>
  <circle cx="44.5" cy="28.5" r="1.8" fill="#ffffff"/>

  </g>
  <text class="plat" x="68" y="26">INSTAGRAM</text>
  <text class="hand" x="68" y="44">@dw_afrizaaa</text>
  <text class="sub" x="68" y="59">Follow &amp; DM →</text>
</svg>