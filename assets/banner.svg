<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Custom Clip Path with Wavy Bottom & Cut/Rounded Top Corners (NOT a plain rectangle!) -->
    <clipPath id="waveShape">
      <path d="M 0,28 Q 0,0 28,0 L 872,0 Q 900,0 900,28 L 900,225 C 750,265 600,195 450,235 C 300,275 150,210 0,245 Z"/>
    </clipPath>

    <!-- Rich Sunset-Cyber Background Gradient -->
    <linearGradient id="bgMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090714"/>
      <stop offset="50%" stop-color="#110b22"/>
      <stop offset="100%" stop-color="#091326"/>
    </linearGradient>

    <!-- Warm Gold-Rose-Cyan Name Gradient -->
    <linearGradient id="heroTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fde047"/>
      <stop offset="75%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#38bdf8"/>
      <animate attributeName="x1" values="0%;50%;0%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <style>
      @keyframes floatWindow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes spinHex {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes eqBar1 { 0%, 100% { height: 8px; y: 184px; } 50% { height: 20px; y: 172px; } }
      @keyframes eqBar2 { 0%, 100% { height: 18px; y: 174px; } 50% { height: 6px; y: 186px; } }
      @keyframes eqBar3 { 0%, 100% { height: 12px; y: 180px; } 50% { height: 22px; y: 170px; } }
      @keyframes eqBar4 { 0%, 100% { height: 20px; y: 172px; } 50% { height: 9px; y: 183px; } }
      @keyframes meteor {
        0% { transform: translate(0, 0); opacity: 0; }
        15% { opacity: 0.9; }
        60% { transform: translate(-220px, 110px); opacity: 0; }
        100% { transform: translate(-220px, 110px); opacity: 0; }
      }

      .ide-window { animation: floatWindow 4.5s ease-in-out infinite; }
      .hex-spin { transform-origin: 62px 62px; animation: spinHex 18s linear infinite; }
      .cursor { animation: blinkCursor 1s infinite; }
      .eq1 { animation: eqBar1 1.1s ease-in-out infinite; }
      .eq2 { animation: eqBar2 0.9s ease-in-out infinite; }
      .eq3 { animation: eqBar3 1.3s ease-in-out infinite; }
      .eq4 { animation: eqBar4 1.0s ease-in-out infinite; }
      .meteor1 { animation: meteor 5s linear infinite; }
      .meteor2 { animation: meteor 7s linear infinite 2.5s; }

      .greet { font-family: 'Courier New', monospace; font-size: 12px; font-weight: bold; fill: #fbbf24; letter-spacing: 2.5px; }
      .hero-name { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 40px; font-weight: 900; fill: url(#heroTextGrad); }
      .hero-sub { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 600; fill: #cbd5e1; }
      .chip-text { font-family: 'Courier New', monospace; font-size: 11px; font-weight: bold; fill: #f8fafc; }
      .code-ln { font-family: 'Courier New', monospace; font-size: 11px; fill: #475569; }
      .code-tx { font-family: 'Courier New', monospace; font-size: 11.5px; fill: #e2e8f0; }
    </style>
  </defs>

  <!-- Main Wavy Sculpted Body -->
  <g clip-path="url(#waveShape)">
    <rect width="900" height="280" fill="url(#bgMain)"/>

    <!-- Ambient Warm & Cool Orbs -->
    <circle cx="140" cy="80" r="160" fill="#f43f5e" opacity="0.12"/>
    <circle cx="720" cy="110" r="180" fill="#8b5cf6" opacity="0.15"/>
    <circle cx="460" cy="220" r="140" fill="#f59e0b" opacity="0.10"/>

    <!-- Shooting Stars / Meteors -->
    <line class="meteor1" x1="480" y1="15" x2="525" y2="-8" stroke="#fde047" stroke-width="1.8" stroke-linecap="round"/>
    <line class="meteor2" x1="820" y1="25" x2="865" y2="2" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Animated Liquid Waves at the Bottom -->
    <g opacity="0.85">
      <path d="M -900,205 Q -675,170 -450,205 T 0,205 T 450,205 T 900,205 T 1350,205 L 1350,280 L -900,280 Z" fill="url(#waveGrad1)">
        <animateTransform attributeName="transform" type="translate" from="0,0" to="900,0" dur="12s" repeatCount="indefinite"/>
      </path>
      <path d="M -900,218 Q -675,250 -450,218 T 0,218 T 450,218 T 900,218 T 1350,218 L 1350,280 L -900,280 Z" fill="url(#waveGrad2)">
        <animateTransform attributeName="transform" type="translate" from="900,0" to="0,0" dur="9s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- ================= LEFT SIDE: ASYMMETRIC HERO IDENTITY ================= -->
    <!-- Rotating Hexagon Emblem -->
    <g class="hex-spin">
      <polygon points="62,38 83,50 83,74 62,86 41,74 41,50" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="6 3"/>
    </g>
    <polygon points="62,44 78,53 78,71 62,80 46,71 46,53" fill="#18122b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="62" y="66" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#fde047">&lt;/&gt;</text>

    <!-- Greeting Tag -->
    <text class="greet" x="98" y="57">HELLO WORLD, I'M</text>
    <rect x="98" y="65" width="95" height="3" rx="1.5" fill="url(#accentGrad)"/>

    <!-- Left-Aligned Big Bold Name -->
    <text class="hero-name" x="38" y="122">M. Afriza Dwi I.</text>

    <!-- School & Major Subtitle -->
    <text class="hero-sub" x="40" y="150">
      🎓 SMK Negeri 4 Padalarang
      <tspan fill="#f43f5e"> • </tspan>
      <tspan fill="#fde047">PPLG / RPL Student</tspan>
    </text>

    <!-- Equalizer & Status Bar (Bottom Left) -->
    <rect class="eq1" x="40" y="184" width="4" height="8" rx="2" fill="#f59e0b"/>
    <rect class="eq2" x="47" y="174" width="4" height="18" rx="2" fill="#f43f5e"/>
    <rect class="eq3" x="54" y="180" width="4" height="12" rx="2" fill="#a855f7"/>
    <rect class="eq4" x="61" y="172" width="4" height="20" rx="2" fill="#38bdf8"/>

    <!-- Slanted Cyber Tag 1 -->
    <polygon points="80,168 215,168 205,194 70,194" fill="#18122b" stroke="#f59e0b" stroke-width="1.2"/>
    <text class="chip-text" x="142" y="185" text-anchor="middle">💻 WEB DEVELOPER</text>

    <!-- Slanted Cyber Tag 2 -->
    <polygon points="225,168 365,168 355,194 215,194" fill="#18122b" stroke="#f43f5e" stroke-width="1.2"/>
    <text class="chip-text" x="290" y="185" text-anchor="middle">🇮🇩 BANDUNG, ID</text>

    <!-- ================= RIGHT SIDE: FLOATING MACOS CODE WINDOW ================= -->
    <g class="ide-window">
      <!-- Window Drop Shadow & Body -->
      <rect x="504" y="28" width="364" height="174" rx="12" fill="#05050a" opacity="0.5"/>
      <rect x="498" y="22" width="364" height="174" rx="12" fill="#0d111f" stroke="#334155" stroke-width="1.5"/>

      <!-- Window Title Bar -->
      <path d="M 498,34 Q 498,22 510,22 L 850,22 Q 862,22 862,34 L 862,50 L 498,50 Z" fill="#161b2e"/>
      <circle cx="516" cy="36" r="5.5" fill="#ef4444"/>
      <circle cx="534" cy="36" r="5.5" fill="#f59e0b"/>
      <circle cx="552" cy="36" r="5.5" fill="#10b981"/>
      <text x="680" y="40" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">afriza.profile.ts — IDE</text>

      <!-- Live Status Pill in Corner of IDE -->
      <rect x="788" y="28" width="62" height="16" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <circle cx="798" cy="36" r="3" fill="#34d399"/>
      <text x="824" y="39.5" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#a7f3d0">ACTIVE</text>

      <!-- Code Lines inside IDE -->
      <text class="code-ln" x="514" y="72">1</text>
      <text class="code-tx" x="534" y="72">
        <tspan fill="#f43f5e">const</tspan> <tspan fill="#38bdf8">student</tspan> = {
      </text>

      <text class="code-ln" x="514" y="92">2</text>
      <text class="code-tx" x="550" y="92">
        <tspan fill="#cbd5e1">username:</tspan> <tspan fill="#fde047">"@afrizadwi21"</tspan>,
      </text>

      <text class="code-ln" x="514" y="112">3</text>
      <text class="code-tx" x="550" y="112">
        <tspan fill="#cbd5e1">passion:</tspan> <tspan fill="#34d399">"Web &amp; Backend"</tspan>,
      </text>

      <text class="code-ln" x="514" y="132">4</text>
      <text class="code-tx" x="550" y="132">
        <tspan fill="#cbd5e1">exploring:</tspan> [<tspan fill="#fb7185">"Next.js"</tspan>, <tspan fill="#38bdf8">"Go"</tspan>],
      </text>

      <text class="code-ln" x="514" y="152">5</text>
      <text class="code-tx" x="550" y="152">
        <tspan fill="#cbd5e1">status:</tspan> <tspan fill="#a78bfa">"Always Learning 🚀"</tspan>
      </text>

      <text class="code-ln" x="514" y="172">6</text>
      <text class="code-tx" x="534" y="172">};</text>
      <rect class="cursor" x="552" y="161" width="7" height="13" fill="#fde047"/>
    </g>
  </g>

  <!-- Glowing Wavy Bottom Accent Border -->
  <path d="M 0,245 C 150,210 300,275 450,235 C 600,195 750,265 900,225" fill="none" stroke="url(#accentGrad)" stroke-width="3.5"/>
</svg>
