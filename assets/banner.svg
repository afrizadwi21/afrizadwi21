<svg width="860" height="240" viewBox="0 0 860 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="50%" stop-color="#07101e"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <radialGradient id="cyanOrb" cx="15%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#0072ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
      <animate attributeName="cx" values="15%;82%;15%" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="25%;75%;25%" dur="16s" repeatCount="indefinite"/>
    </radialGradient>

    <radialGradient id="emeraldOrb" cx="85%" cy="75%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.24"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
      <animate attributeName="cx" values="85%;20%;85%" dur="19s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="75%;20%;75%" dur="19s" repeatCount="indefinite"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#7dd3fc"/>
      <stop offset="70%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#ffffff"/>
      <animate attributeName="x1" values="-50%;50%;-50%" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="50%;150%;50%" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.6"/>
    </linearGradient>

    <pattern id="hexGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#38bdf8" fill-opacity="0.18"/>
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#38bdf8" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clip">
      <rect width="860" height="240" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="860" height="240" fill="url(#bg)"/>
    <rect width="860" height="240" fill="url(#hexGrid)"/>
    <rect width="860" height="240" fill="url(#cyanOrb)"/>
    <rect width="860" height="240" fill="url(#emeraldOrb)"/>

    <!-- Animated Radar / Orbital Rings on Right -->
    <g transform="translate(760, 120)" opacity="0.28">
      <circle cx="0" cy="0" r="85" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="8 6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="58" fill="none" stroke="#10b981" stroke-width="1.2" stroke-dasharray="14 8">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#6366f1" stroke-width="1"/>
    </g>

    <!-- Floating Code Snippet on Left -->
    <g font-family="monospace" font-size="10" fill="#38bdf8" opacity="0.22">
      <text x="24" y="195">package main</text>
      <text x="24" y="210">const dev = "Web Developer Student"</text>
      <animate attributeName="opacity" values="0.12;0.32;0.12" dur="4s" repeatCount="indefinite"/>
    </g>

    <!-- Top Status Pill -->
    <g transform="translate(310, 26)">
      <rect width="240" height="26" rx="13" fill="#0b172a" stroke="#1e3a5f" stroke-width="1"/>
      <circle cx="18" cy="13" r="4.5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="17" font-family="monospace" font-size="11" font-weight="bold" fill="#94a3b8" letter-spacing="1.2">
        ONLINE • @AFRIZADWI21
      </text>
    </g>

    <!-- Main Name Title -->
    <text x="430" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="900" letter-spacing="2.5" fill="url(#titleGrad)" filter="url(#glow)">
      M. AFRIZA DWI I
    </text>

    <!-- Animated laser underline -->
    <rect x="260" y="122" width="340" height="2" rx="1" fill="url(#borderGrad)">
      <animate attributeName="width" values="120;360;120" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x" values="370;250;370" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- Role Pills -->
    <g transform="translate(155, 142)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="170" height="30" rx="8" fill="#081c24" stroke="#00add8" stroke-width="1.2"/>
      <text x="85" y="19" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="bold" fill="#38bdf8">
        💻 WEB DEVELOPER
      </text>

      <!-- Pill 2 -->
      <rect x="185" y="0" width="180" height="30" rx="8" fill="#091e1a" stroke="#10b981" stroke-width="1.2"/>
      <text x="275" y="19" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="bold" fill="#34d399">
        🚀 PPLG / RPL STUDENT
      </text>

      <!-- Pill 3 -->
      <rect x="380" y="0" width="170" height="30" rx="8" fill="#131129" stroke="#8b5cf6" stroke-width="1.2"/>
      <text x="465" y="19" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="bold" fill="#a78bfa">
        🌱 ALWAYS LEARNING
      </text>
    </g>

    <!-- Bottom Tagline -->
    <text x="430" y="206" text-anchor="middle" font-family="monospace" font-size="12" letter-spacing="2" fill="#64748b">
      CRAFTING HIGH-PERFORMANCE APPS WITH CODE, CREATIVITY &amp; CURIOSITY
    </text>
  </g>

  <rect x="1" y="1" width="858" height="238" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>
</svg>