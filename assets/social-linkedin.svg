<svg width="205" height="74" viewBox="0 0 205 74" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes glowPulse { 0%, 100% { stroke-opacity: 0.4; } 50% { stroke-opacity: 1; } }
      @keyframes badgeFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-2.5px); } }
      .card-bg { fill: #090e1a; stroke: #0ea5e9; stroke-width: 1.5; rx: 12px; animation: glowPulse 3s infinite ease-in-out; }
      .icon-box { fill: #0ea5e9; fill-opacity: 0.16; stroke: #0ea5e9; stroke-width: 1.2; rx: 10px; animation: badgeFloat 2.4s infinite ease-in-out; }
      .icon-txt { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 900; fill: #0ea5e9; animation: badgeFloat 2.4s infinite ease-in-out; }
      .plat { font-family: monospace; font-size: 10px; font-weight: bold; fill: #0ea5e9; letter-spacing: 1px; }
      .hand { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
      .sub { font-family: monospace; font-size: 9.5px; fill: #64748b; }
    </style>
  </defs>
  <rect class="card-bg" x="2" y="2" width="201" height="70" rx="12"/>
  <rect class="icon-box" x="14" y="15" width="44" height="44" rx="10"/>
  <text class="icon-txt" x="36" y="43" text-anchor="middle">in</text>
  <text class="plat" x="68" y="26">LINKEDIN</text>
  <text class="hand" x="68" y="44">Afriza Dwi</text>
  <text class="sub" x="68" y="59">Let's connect →</text>
</svg>