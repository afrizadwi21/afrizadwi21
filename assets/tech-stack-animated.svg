      <g transform="translate(25, 15)">
        <polygon points="5,2 35,2 32,36 20,40 8,36" fill="#e34f26"/>
        <polygon points="20,5 32,5 30,33 20,36" fill="#ef652a"/>
        <path d="M12 11 l16 0 l-1 5 l-11 0 l1 5 l9 0 l-1 10 l-6 2 l-6 -2 l-1 -4 l4 0 l0 2 l3 1 l3 -1 l1 -4 l-8 0 z" fill="#ffffff"/>
      </g>
