  <!-- 15. Figma -->
  <g transform="translate(645, 125)">
    <g class="anim-f2">
      <rect class="card-box" width="90" height="95" stroke="#a855f7"/>
      <g transform="translate(27, 15)">
        <rect x="5" y="3" width="12" height="11" rx="6" fill="#f24e1e"/>
        <rect x="17" y="3" width="12" height="11" rx="6" fill="#ff7262"/>
        <rect x="5" y="14" width="12" height="11" rx="6" fill="#a259ff"/>
        <circle cx="23" cy="19.5" r="5.5" fill="#1abcfe"/>
        <rect x="5" y="25" width="12" height="11" rx="6" fill="#0acf83"/>
      </g>
      <text class="logo-label" x="45" y="80">Figma</text>
    </g>
  </g>

  <!-- 16. GitHub -->
  <g transform="translate(750, 125)">
    <g class="anim-f1">
      <rect class="card-box" width="90" height="95" stroke="#94a3b8"/>
      <g transform="translate(25, 15)">
        <circle cx="20" cy="20" r="19" fill="#181717" stroke="#ffffff" stroke-width="1.2"/>
        <path d="M20 7 C12.8 7 7 12.8 7 20 C7 25.7 10.7 30.6 15.9 32.3 C16.5 32.4 16.7 32 16.7 31.7 L16.7 29.5 C13.1 30.3 12.3 27.8 12.3 27.8 C11.7 26.3 10.9 25.9 10.9 25.9 C9.7 25.1 11 25.1 11 25.1 C12.3 25.2 13 26.5 13 26.5 C14.1 28.5 16 27.9 16.7 27.6 C16.8 26.7 17.1 26.2 17.5 25.8 C14.6 25.5 11.6 24.4 11.6 19.4 C11.6 18 12.1 16.8 12.9 15.9 C12.8 15.6 12.3 14.2 13 12.5 C13 12.5 14.1 12.1 16.6 13.8 C17.6 13.5 18.8 13.4 20 13.4 C21.2 13.4 22.4 13.5 23.4 13.8 C25.9 12.1 27 12.5 27 12.5 C27.7 14.2 27.2 15.6 27.1 15.9 C27.9 16.8 28.4 18 28.4 19.4 C28.4 24.4 25.4 25.5 22.5 25.8 C23 26.2 23.4 27 23.4 28.2 L23.4 31.7 C23.4 32 23.6 32.4 24.2 32.3 C29.3 30.6 33 25.7 33 20 C33 12.8 27.2 7 20 7 Z" fill="#ffffff"/>
