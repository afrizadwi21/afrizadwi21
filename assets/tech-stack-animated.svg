<svg width="860" height="240" viewBox="0 0 860 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes float1 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-7px); } }
      @keyframes float2 { 0%, 100% { transform: translateY(-7px); } 50% { transform: translateY(0px); } }
      @keyframes float3 { 0%, 100% { transform: translateY(-3px); } 50% { transform: translateY(-10px); } }
      @keyframes pulseBorder { 0%, 100% { stroke-opacity: 0.35; filter: drop-shadow(0 0 2px rgba(0,242,254,0.2)); } 50% { stroke-opacity: 1; filter: drop-shadow(0 0 8px rgba(0,242,254,0.6)); } }
      @keyframes spinReact { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      
      .card-box { fill: #080d1a; stroke-width: 1.5; rx: 14px; animation: pulseBorder 3s infinite ease-in-out; }
      .anim-f1 { animation: float1 3s infinite ease-in-out; }
      .anim-f2 { animation: float2 3.4s infinite ease-in-out; }
      .anim-f3 { animation: float3 2.8s infinite ease-in-out; }
      .spin-atom { transform-origin: 40px 40px; animation: spinReact 10s infinite linear; }
      .logo-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #cbd5e1; text-anchor: middle; }
    </style>
  </defs>

  <!-- BARIS 1 (Frontend & Core Languages) -->
  <!-- 1. JavaScript -->
  <g transform="translate(15, 10)">
    <g class="anim-f1">
      <rect class="card-box" width="90" height="95" stroke="#f7df1e"/>
      <g transform="translate(25, 15)">
        <rect width="40" height="40" rx="8" fill="#f7df1e"/>
        <path d="M22 28 c2 3 5 5 9 5 c4 0 7 -2 7 -6 c0 -5 -3 -6 -8 -8 c-7 -3 -12 -6 -12 -12 c0 -6 5 -10 12 -10 c5 0 9 2 11 6 l-4 3 c-2 -3 -4 -4 -7 -4 c-4 0 -6 2 -6 5 c0 4 3 5 8 7 c8 3 13 6 13 13 c0 7 -5 11 -13 11 c-6 0 -11 -3 -13 -7 z" fill="#000000"/>
        <path d="M7 12 l6 0 l0 22 c0 4 -2 6 -6 6 c-2 0 -4 -1 -5 -2 l2 -4 c1 1 2 1 3 1 c1 0 2 -1 2 -3 l0 -20 z" fill="#000000"/>
      </g>
      <text class="logo-label" x="45" y="80">JavaScript</text>
    </g>
  </g>

  <!-- 2. TypeScript -->
  <g transform="translate(120, 10)">
    <g class="anim-f2">
      <rect class="card-box" width="90" height="95" stroke="#3178c6"/>
      <g transform="translate(25, 15)">
        <rect width="40" height="40" rx="8" fill="#3178c6"/>
        <path d="M5 13 l18 0 l0 5 l-6 0 l0 17 l-6 0 l0 -17 l-6 0 z" fill="#ffffff"/>
        <path d="M24 30 c2 2 4 3 7 3 c3 0 5 -1 5 -4 c0 -3 -2 -4 -6 -6 c-5 -2 -9 -5 -9 -9 c0 -5 4 -8 9 -8 c4 0 7 1 9 4 l-3 3 c-2 -2 -3 -3 -6 -3 c-3 0 -5 1 -5 3 c0 3 2 4 6 5 c6 2 9 5 9 10 c0 5 -4 9 -10 9 c-4 0 -8 -2 -10 -5 z" fill="#ffffff"/>
      </g>
      <text class="logo-label" x="45" y="80">TypeScript</text>
    </g>
  </g>

  <!-- 3. React (Spinning Atom!) -->
  <g transform="translate(225, 10)">
    <g class="anim-f3">
      <rect class="card-box" width="90" height="95" stroke="#00f2fe"/>
      <g transform="translate(5, 5)">
        <circle cx="40" cy="35" r="4.5" fill="#00f2fe"/>
        <g class="spin-atom">
          <ellipse cx="40" cy="40" rx="20" ry="7.5" fill="none" stroke="#00f2fe" stroke-width="2"/>
          <ellipse cx="40" cy="40" rx="20" ry="7.5" fill="none" stroke="#00f2fe" stroke-width="2" transform="rotate(60 40 40)"/>
          <ellipse cx="40" cy="40" rx="20" ry="7.5" fill="none" stroke="#00f2fe" stroke-width="2" transform="rotate(120 40 40)"/>
        </g>
      </g>
      <text class="logo-label" x="45" y="80">React.js</text>
    </g>
  </g>

  <!-- 4. Next.js -->
  <g transform="translate(330, 10)">
    <g class="anim-f1">
      <rect class="card-box" width="90" height="95" stroke="#ffffff"/>
      <g transform="translate(25, 15)">
        <circle cx="20" cy="20" r="20" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>
        <path d="M14 11 l0 18 l4 0 l0 -11 l11 15 l3 0 l-14 -19 l-4 -3 z" fill="#ffffff"/>
        <rect x="25" y="11" width="3.5" height="11" fill="#ffffff"/>
      </g>
      <text class="logo-label" x="45" y="80">Next.js</text>
    </g>
  </g>

  <!-- 5. Node.js -->
  <g transform="translate(435, 10)">
    <g class="anim-f2">
      <rect class="card-box" width="90" height="95" stroke="#10b981"/>
      <g transform="translate(25, 15)">
        <polygon points="20,2 38,12 38,32 20,42 2,32 2,12" fill="#539e43"/>
        <path d="M20 12 c-4 0 -7 2 -7 6 c0 5 4 6 8 7 c3 1 5 2 5 4 c0 2 -2 3 -4 3 c-3 0 -5 -1 -6 -3 l-3 3 c2 3 5 4 9 4 c5 0 8 -2 8 -7 c0 -5 -4 -6 -8 -7 c-3 -1 -5 -2 -5 -4 c0 -2 2 -3 4 -3 c2 0 4 1 5 2 l3 -3 c-2 -2 -4 -3 -7 -3 z" fill="#ffffff"/>
      </g>
      <text class="logo-label" x="45" y="80">Node.js</text>
    </g>
  </g>

  <!-- 6. Go (Golang) -->
  <g transform="translate(540, 10)">
    <g class="anim-f3">
      <rect class="card-box" width="90" height="95" stroke="#00add8"/>
      <g transform="translate(20, 17)">
        <rect width="50" height="36" rx="6" fill="#00add8"/>
        <text x="25" y="26" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" font-style="italic">GO</text>
      </g>
      <text class="logo-label" x="45" y="80">Golang</text>
    </g>
  </g>

  <!-- 7. PHP -->
  <g transform="translate(645, 10)">
    <g class="anim-f1">
      <rect class="card-box" width="90" height="95" stroke="#8b5cf6"/>
      <g transform="translate(22, 18)">
        <ellipse cx="23" cy="18" rx="23" ry="15" fill="#777bb4"/>
        <text x="23" y="24" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">php</text>
