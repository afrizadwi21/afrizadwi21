      <text class="logo-label" x="45" y="80">PHP</text>
    </g>
  </g>

  <!-- 8. Laravel -->
  <g transform="translate(750, 10)">
    <g class="anim-f2">
      <rect class="card-box" width="90" height="95" stroke="#f43f5e"/>
      <g transform="translate(25, 15)">
        <rect width="40" height="40" rx="8" fill="#ff2d20"/>
        <path d="M10 28 L18 12 L24 23 L28 17 L32 28 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text class="logo-label" x="45" y="80">Laravel</text>
    </g>
  </g>

  <!-- BARIS 2 (Web Standards, DB & DevOps) -->
