    </g>
  </g>

  <!-- 10. CSS3 -->
  <g transform="translate(120, 125)">
    <g class="anim-f1">
      <rect class="card-box" width="90" height="95" stroke="#1572b6"/>
      <g transform="translate(25, 15)">
        <polygon points="5,2 35,2 32,36 20,40 8,36" fill="#1572b6"/>
        <polygon points="20,5 32,5 30,33 20,36" fill="#33a9dc"/>
        <path d="M12 11 l16 0 l-1 5 l-11 0 l1 5 l9 0 l-1 10 l-6 2 l-6 -2 l-1 -4 l4 0 l0 2 l3 1 l3 -1 l1 -4 l-8 0 z" fill="#ffffff"/>
      </g>
      <text class="logo-label" x="45" y="80">CSS3</text>
    </g>
  </g>

  <!-- 11. Python -->
  <g transform="translate(225, 125)">
    <g class="anim-f3">
      <rect class="card-box" width="90" height="95" stroke="#fbbf24"/>
      <g transform="translate(25, 15)">
        <rect width="40" height="40" rx="8" fill="#1e293b"/>
        <path d="M20 7 C14 7 14 10 14 10 L14 13 L21 13 L21 14 L11 14 C11 14 7 14 7 20 C7 26 10 26 10 26 L12 26 L12 23 C12 20 15 20 15 20 L22 20 C24 20 25 18 25 16 L25 10 C25 10 25 7 20 7 Z" fill="#38bdf8"/>
        <circle cx="17" cy="10" r="1.3" fill="#ffffff"/>
        <path d="M20 33 C26 33 26 30 26 30 L26 27 L19 27 L19 26 L29 26 C29 26 33 26 33 20 C33 14 30 14 30 14 L28 14 L28 17 C28 20 25 20 25 20 L18 20 C16 20 15 22 15 24 L15 30 C15 30 15 33 20 33 Z" fill="#fde047"/>
        <circle cx="23" cy="30" r="1.3" fill="#000000"/>
      </g>
      <text class="logo-label" x="45" y="80">Python</text>
    </g>
  </g>

  <!-- 12. MySQL -->
  <g transform="translate(330, 125)">
    <g class="anim-f2">
      <rect class="card-box" width="90" height="95" stroke="#00758f"/>
      <g transform="translate(20, 17)">
        <rect width="50" height="36" rx="6" fill="#00758f"/>
        <text x="25" y="24" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">MySQL</text>
      </g>
      <text class="logo-label" x="45" y="80">MySQL</text>
    </g>
  </g>

  <!-- 13. Docker -->
  <g transform="translate(435, 125)">
    <g class="anim-f1">
      <rect class="card-box" width="90" height="95" stroke="#2496ed"/>
      <g transform="translate(22, 17)">
        <path d="M38 18 C37 16 34 16 33 17 C32 15 29 14 26 15 L26 12 L22 12 L22 15 L18 15 L18 12 L14 12 L14 15 L10 15 L10 12 L6 12 L6 15 C3 15 1 17 1 20 C1 26 6 31 16 31 C26 31 36 27 38 18 Z" fill="#2496ed"/>
        <rect x="10" y="15" width="3" height="3" fill="#ffffff"/>
        <rect x="14" y="15" width="3" height="3" fill="#ffffff"/>
        <rect x="18" y="15" width="3" height="3" fill="#ffffff"/>
        <rect x="22" y="15" width="3" height="3" fill="#ffffff"/>
        <rect x="14" y="11" width="3" height="3" fill="#ffffff"/>
        <rect x="18" y="11" width="3" height="3" fill="#ffffff"/>
      </g>
      <text class="logo-label" x="45" y="80">Docker</text>
    </g>
  </g>

  <!-- 14. Postman / REST API -->
  <g transform="translate(540, 125)">
    <g class="anim-f3">
      <rect class="card-box" width="90" height="95" stroke="#ff6c37"/>
      <g transform="translate(25, 15)">
        <circle cx="20" cy="20" r="18" fill="#ff6c37"/>
        <path d="M12 24 L28 14 L20 28 L18 22 Z" fill="#ffffff"/>
